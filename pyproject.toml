[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-agile-frontend-agent"
version = "0.1.0"
description = "A single Strands frontend engineer POC with scoped tools, hooks, and deterministic evals"
requires-python = ">=3.11"
dependencies = ["strands-agents>=1.0,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["frontend_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
